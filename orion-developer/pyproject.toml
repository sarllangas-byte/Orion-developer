[project]
name = "orion-developer"
version = "0.1.0"
description = "Agent développeur contrôlé et traçable pour le POC GeoStab"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
